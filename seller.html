<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الملف الشخصي — حُرفة</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛠️</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="header"></div>
<div id="content"></div>
<div id="footer"></div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
  renderHeader();
  renderFooter();

  const seller = sellerById(parseInt(param('id')));
  const content = document.getElementById('content');

  if (!seller) {
    content.innerHTML = `
      <div class="container">
        <div class="empty-state" style="margin:60px 0">
          <div class="icon">😕</div>
          <h3>البائع غير موجود</h3>
          <p>ربما تكون قد اتبعت رابطاً غير صحيح</p>
          <a href="browse.html" class="btn btn-primary">تصفح الخدمات</a>
        </div>
      </div>`;
  } else {
    document.title = seller.name + ' — حُرفة';
    const sellerGigs = GIGS.filter(g => g.sellerId === seller.id);
    const levelBadge = seller.level === 'أفضل بائع' ? 'badge-gold' : seller.level === 'بائع مميز' ? 'badge-green' : seller.level === 'بائع موثوق' ? 'badge-blue' : 'badge-gray';

    content.innerHTML = `
    <div class="seller-hero">
      <div class="container">
        <div class="seller-hero-inner">
          ${avatarHtml(seller.name, 'avatar-xl')}
          <div>
            <h1>${esc(seller.name)} <span class="badge ${levelBadge}" style="vertical-align:middle">${esc(seller.level)}</span></h1>
            <p class="sub">${esc(seller.title)}</p>
            <div class="meta">
              <span>⭐ ${seller.rating.toFixed(1)} تقييم</span>
              <span>📦 ${seller.sales} عملية بيع</span>
              <span>📍 ${esc(seller.country)}</span>
              <span>🕐 يرد خلال ${esc(seller.response)}</span>
              <span>📅 عضو منذ ${seller.since}</span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="container">
      <div class="section" style="padding-top:44px">
        <div class="panel">
          <h2>نبذة عني</h2>
          <p style="font-size:15.5px">${esc(seller.bio)}</p>
        </div>

        <div class="section-head" style="margin-top:14px">
          <div>
            <h2>خدمات ${esc(seller.name)} (${sellerGigs.length})</h2>
          </div>
        </div>
        <div class="gigs-grid" style="grid-template-columns:repeat(3,1fr)">
          ${sellerGigs.map(gigCardHtml).join('') || '<p style="color:var(--muted)">لا توجد خدمات معروضة حالياً.</p>'}
        </div>
      </div>
    </div>`;
  }
</script>
</body>
</html>
