<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول — حُرفة</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛠️</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="header"></div>

<div class="auth-wrap">
  <div class="auth-card">
    <h1>أهلاً بعودتك 👋</h1>
    <p>سجّل الدخول لمتابعة طلباتك وخدماتك.</p>
    <div class="form-error" id="formError"></div>
    <form id="loginForm">
      <div class="field">
        <label for="email">البريد الإلكتروني</label>
        <input class="input" type="email" id="email" placeholder="you@example.com" required>
      </div>
      <div class="field">
        <label for="password">كلمة المرور</label>
        <input class="input" type="password" id="password" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn btn-primary btn-lg btn-block">تسجيل الدخول</button>
    </form>
    <p class="alt">ليس لديك حساب؟ <a href="register.html" id="registerLink">أنشئ حساباً مجاناً</a></p>
    <p class="alt" style="font-size:12.5px; margin-top:12px; background:var(--bg-soft); border-radius:10px; padding:10px">
      🛡️ لتجربة لوحة الإدارة: <b>admin@hurfa.com</b> / كلمة المرور <b>admin123</b>
    </p>
  </div>
</div>

<div id="footer"></div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
  renderHeader();
  renderFooter();

  if (getUser()) location.href = 'dashboard.html';

  // تمرير وجهة العودة إلى صفحة التسجيل أيضاً
  const next = param('next');
  if (next) document.getElementById('registerLink').href = 'register.html?next=' + encodeURIComponent(next);

  document.getElementById('loginForm').addEventListener('submit', e => {
    e.preventDefault();
    const email = document.getElementById('email').value.trim().toLowerCase();
    const password = document.getElementById('password').value;
    const err = document.getElementById('formError');

    const users = lsGet(LS.users, []);
    const user = users.find(u => u.email === email && u.password === password);
    if (!user) {
      err.textContent = 'البريد الإلكتروني أو كلمة المرور غير صحيحة. إن لم يكن لديك حساب فأنشئ واحداً أولاً.';
      err.classList.add('show');
      return;
    }

    setUser({ name: user.name, email: user.email, avatar: user.avatar || null });
    location.href = next ? decodeURIComponent(next) : (user.email === ADMIN_EMAIL ? 'admin.html' : 'dashboard.html');
  });
</script>
</body>
</html>
