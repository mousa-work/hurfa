<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إنشاء حساب — حُرفة</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛠️</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="header"></div>

<div class="auth-wrap">
  <div class="auth-card">
    <h1>انضم إلى حُرفة 🎉</h1>
    <p>أنشئ حسابك مجاناً وابدأ رحلتك، سواء كمشترٍ أو بائع.</p>
    <div class="form-error" id="formError"></div>
    <form id="registerForm">
      <div class="field">
        <label>الصورة الشخصية <span style="color:var(--danger)">*</span></label>
        <div class="avatar-upload">
          <div class="avatar-preview" id="avatarPreview">📷</div>
          <div>
            <input type="file" id="avatarInput" accept="image/*" style="display:none">
            <button type="button" class="btn btn-outline btn-sm" onclick="document.getElementById('avatarInput').click()">اختر صورة</button>
            <div class="hint">إلزامية لجميع المستخدمين — تظهر في حسابك وملفك العام</div>
          </div>
        </div>
      </div>
      <div class="field">
        <label for="name">الاسم الكامل</label>
        <input class="input" type="text" id="name" placeholder="مثال: محمد أحمد" required>
      </div>
      <div class="field">
        <label for="email">البريد الإلكتروني</label>
        <input class="input" type="email" id="email" placeholder="you@example.com" required>
      </div>
      <div class="field">
        <label for="password">كلمة المرور</label>
        <input class="input" type="password" id="password" placeholder="6 أحرف على الأقل" minlength="6" required>
        <div class="hint">هذا موقع تجريبي — البيانات تُحفظ في متصفحك فقط ولا تُرسل لأي خادم.</div>
      </div>
      <button type="submit" class="btn btn-primary btn-lg btn-block">إنشاء الحساب</button>
    </form>
    <p class="alt">لديك حساب بالفعل؟ <a href="login.html">سجّل الدخول</a></p>
  </div>
</div>

<div id="footer"></div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
  renderHeader();
  renderFooter();

  if (getUser()) location.href = 'dashboard.html';

  // الصورة الشخصية (إلزامية): تُصغَّر إلى مربع 160px وتُخزَّن Data URL
  let avatarData = null;
  document.getElementById('avatarInput').addEventListener('change', e => {
    const file = e.target.files[0];
    if (!file) return;
    fileToDataUrl(file, 160, dataUrl => {
      avatarData = dataUrl;
      document.getElementById('avatarPreview').innerHTML = `<img src="${dataUrl}" alt="الصورة الشخصية">`;
    });
  });

  document.getElementById('registerForm').addEventListener('submit', e => {
    e.preventDefault();
    const name = document.getElementById('name').value.trim();
    const email = document.getElementById('email').value.trim().toLowerCase();
    const password = document.getElementById('password').value;
    const err = document.getElementById('formError');

    if (!avatarData) {
      err.textContent = 'الصورة الشخصية إلزامية — اختر صورة لإكمال التسجيل.';
      err.classList.add('show');
      window.scrollTo(0, 0);
      return;
    }

    const users = lsGet(LS.users, []);
    if (users.some(u => u.email === email)) {
      err.textContent = 'هذا البريد الإلكتروني مسجّل بالفعل. جرّب تسجيل الدخول.';
      err.classList.add('show');
      return;
    }

    const user = { name, email, password, avatar: avatarData, joined: new Date().toISOString() };
    users.push(user);
    lsSet(LS.users, users);
    setUser({ name, email, avatar: avatarData });

    const next = param('next');
    location.href = next ? decodeURIComponent(next) : 'dashboard.html';
  });
</script>
</body>
</html>
